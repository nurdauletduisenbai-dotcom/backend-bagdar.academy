# bagdar.academy с HTTPS (сертификат Let's Encrypt, продлевается certbot.timer)
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name bagdar.academy www.bagdar.academy _;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://bagdar.academy$request_uri;
    }
}

# www -> без www
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.bagdar.academy;

    ssl_certificate /etc/letsencrypt/live/bagdar.academy/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bagdar.academy/privkey.pem;

    return 301 https://bagdar.academy$request_uri;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name bagdar.academy;

    ssl_certificate /etc/letsencrypt/live/bagdar.academy/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bagdar.academy/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    include snippets/bagdar-locations.conf;
}

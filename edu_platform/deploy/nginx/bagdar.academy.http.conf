# bagdar.academy без HTTPS — до выпуска сертификата (setup.sh ssl заменит на bagdar.academy.https.conf)
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name bagdar.academy www.bagdar.academy _;

    # Проверка домена для Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    include snippets/bagdar-locations.conf;
}

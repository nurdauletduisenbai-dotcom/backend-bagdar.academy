name: EduPlatform CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: edu_platform/backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: edu_platform_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: edu_platform/backend/requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Ruff Linter
        run: ruff check .

      - name: Check migrations are up to date
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/edu_platform_db
          DJANGO_SECRET_KEY: test-key-for-github-actions-ci-12345
        run: python manage.py makemigrations --check --dry-run --settings=config.settings.test

      - name: Run Pytest Test Suite
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/edu_platform_db
          REDIS_URL: redis://localhost:6379/0
          DJANGO_SECRET_KEY: test-key-for-github-actions-ci-12345
        run: pytest -v --cov=apps

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: edu_platform/frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: edu_platform/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build
        run: npm run build

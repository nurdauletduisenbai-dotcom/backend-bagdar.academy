# Общие location-ы bagdar.academy (подключаются из sites-available/bagdar.academy)
root /var/www/bagdar.academy/frontend;
index index.html;

client_max_body_size 25m;   # MAX_UPLOAD_SIZE_MB=20 + запас на multipart

gzip on;
gzip_types text/css application/javascript application/json image/svg+xml;

# Django: API, админка, документация, health-check-и
location ~ ^/(api|admin|docs|redoc|health|ready)(/|$) {
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
}

# Статика Django (админка, Swagger) — collectstatic кладёт её сюда
location /static/ {
    alias /var/www/bagdar.academy/static/;
    expires 30d;
    access_log off;
}

# Ассеты Vite с хешем в имени — кэшируются надолго
location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
}

# SPA: неизвестные пути отдают index.html (vue-router history mode)
location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
}

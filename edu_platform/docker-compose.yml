# Локальная разработка EduPlatform: один `docker compose up` поднимает всё.
#   Frontend (Vue/Vite):  http://localhost:5173
#   Backend API / Swagger: http://localhost:8000/docs/
#   MailHog (письма):      http://localhost:8025

x-backend-env: &backend-env
  DJANGO_SETTINGS_MODULE: config.settings.dev
  DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-edu_platform_db}
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/1
  CELERY_RESULT_BACKEND: redis://redis:6379/2
  EMAIL_HOST: mailhog
  EMAIL_PORT: 1025

services:
  db:
    image: postgres:16-alpine
    container_name: edu_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-edu_platform_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: edu_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      target: dev
    container_name: edu_backend
    env_file:
      - path: .env
        required: false
    environment:
      <<: *backend-env
      DJANGO_MIGRATE: "1"
    volumes:
      - ./backend:/app
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 10

  worker:
    build:
      context: ./backend
      target: dev
    container_name: edu_worker
    command: celery -A config worker -l info
    env_file:
      - path: .env
        required: false
    environment:
      <<: *backend-env
    volumes:
      - ./backend:/app
    depends_on:
      backend:
        condition: service_healthy

  beat:
    build:
      context: ./backend
      target: dev
    container_name: edu_beat
    command: celery -A config beat -l info --schedule /tmp/celerybeat-schedule
    env_file:
      - path: .env
        required: false
    environment:
      <<: *backend-env
    volumes:
      - ./backend:/app
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      target: dev
    container_name: edu_frontend
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./frontend:/app
      # node_modules остаются внутри контейнера (собраны под Linux)
      - frontend_node_modules:/app/node_modules
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      - backend

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: edu_mailhog
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  pgdata:
  frontend_node_modules:
